<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Test 2 Practice | OTC OW</title>
    <meta name="description" content="Homework-style practice problems for Test 2 on relative motion: RIC signs from two element sets, picturing the motion from a state or from RMOEs, converting between position and velocity and RMOEs, and the motion after a radial or in-track burn. Practice mode shows each problem in the RIC frame and walks through the steps. Test mode accepts answers only, then shows the solution.">
    <meta name="robots" content="noindex">
    <link href="../vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="../vendor/katex/katex.min.css">
    <link rel="stylesheet" href="../assets/tool-theme.css">
    <link rel="stylesheet" href="../rpo/rpo-theme.css">
    <style>
        :root {
            --param-a: #ff8a3d;
            --param-e: #34d399;
            --param-i: #38bdf8;
            --param-raan: #a3e635;
            --param-argp: #f472b6;
            --param-nu: #c4a1ff;
            --param-v: #e0b64f;
            --param-dv: #f87171;
            --answer-right: #34d399;
            --answer-wrong: #f87171;
        }

        [hidden] { display: none !important; }

        /* Math */
        .katex { font-size: 1.08em; }
        .tex-source { font-family: var(--font-mono); font-size: 0.85em; overflow-wrap: anywhere; }

        /* Test mode before grading: answers only, in one centered column */
        body.answers-only .tool-stage-col { display: none; }
        body.answers-only .tool-layout { grid-template-columns: minmax(0, 40rem); justify-content: center; }

        /* Caption: below the view, so that nothing covers the drawing */
        .tool-hud {
            position: static;
            max-width: none;
            margin-top: 0.5rem;
            padding: 0;
            min-height: 4.1em;
            background: none;
            border: 0;
            border-radius: 0;
            font-size: 0.84rem;
            line-height: 1.35;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .tool-hud b { font-weight: 600; color: #ffffff; }
        .tool-hud .katex { color: #ffffff; }

        .view-reset {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            z-index: 2;
            padding: 0.28rem 0.6rem;
            font-size: 0.74rem;
        }

        /* Labels in the view */
        .tool-label { z-index: 1; }
        .tool-label.word { color: var(--text-muted); font-size: 0.72rem; }

        .tool-label.measure {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0 0.25rem;
            border-radius: 3px;
            background: rgba(6, 11, 20, 0.72);
        }

        .tool-label.measure .val { margin-left: 0.35rem; color: #ffffff; }
        .tool-label.measure .val:empty { display: none; }

        .tool-label.axis {
            z-index: 0;
            font-size: 1.05rem;
            padding: 0 0.3rem;
            border-radius: 3px;
            color: #ffffff;
            background: rgba(6, 11, 20, 0.72);
        }

        .tool-label.axis .katex { color: #93c5fd; }
        .tool-label .katex { font-size: 1.12em; }

        /* Mode and new problem */
        .tool-side .panel { padding: 0.8rem 0.9rem; }
        .tool-side > .col > .panel { flex-grow: 0; }

        .mode-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 0.75rem;
        }

        .mode-row .segmented { flex: 1 1 12rem; }

        /* Section: R-V, maneuver or rendezvous problems. Each has its own kinds of problem.
           On a phone, a long section name wraps to two lines instead of being cut off. */
        /* Eight sections: two rows of four, or four rows of two on a phone. */
        .sections {
            margin: 0.8rem 0 0;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.3rem;
        }
        .sections button {
            padding: 0.6rem 0.6rem;
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.3;
            white-space: normal;
            border: 1px solid var(--border-accent);
        }
        @media (max-width: 640px) {
            .sections { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        /* Extra sections (beyond the six test topics): a gold tag under the name and a gold edge. */
        .sections button.extra { border-left: 3px solid var(--accent-gold); }
        .extra-tag {
            display: block;
            margin-top: 0.2rem;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-gold);
        }

        /* Dev version only: a section that is not published yet gets a dashed outline. */
        .sections button.unpublished { outline: 1px dashed currentColor; outline-offset: -4px; }


        /* Topic: which kind of maneuver is generated */
        .topics { flex-wrap: wrap; margin-top: 0.5rem; }
        .topics button { flex: 1 1 auto; padding: 0.3rem 0.5rem; font-size: 0.76rem; }

        /* The given vectors */
        .given {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(8.6rem, 1fr));
            align-items: center;
            gap: 0.4rem 0.8rem;
            margin: 0.55rem 0 0.75rem;
            padding: 0.5rem 0.7rem;
            background: var(--deep-space);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            font-size: 0.92rem;
            color: #ffffff;
        }

        .given-item { white-space: nowrap; }

        /* Answers */
        .answers {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.4rem 0.8rem;
        }

        .answer label {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            margin-bottom: 0.15rem;
            font-size: 0.78rem;
            line-height: 1.3;
            color: var(--text-muted);
        }

        .answer .sym { color: #f87171; }
        .answer-label {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            margin-bottom: 0.25rem;
            font-size: 0.78rem;
            line-height: 1.3;
            color: var(--text-muted);
        }

        /* The givens: a table of both element sets, with the rows that differ marked */
        .given[hidden] { display: none; }
        .given-wide { grid-column: 1 / -1; white-space: normal; overflow-x: auto; }
        .el-given { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.84rem; margin: 0 auto; }
        .el-given th, .el-given td { padding: 0.18rem 0.7rem; text-align: right; }
        .el-given thead th { font-family: var(--font-sans); font-size: 0.74rem; color: var(--text-muted); font-weight: 600; }
        .el-given tbody th { text-align: center; color: var(--text-muted); font-weight: 400; }
        .el-given tr.differs td, .el-given tr.differs th { color: var(--accent-gold); font-weight: 600; }

        /* Picks: words or signs as a row of buttons */
        .answer.pick { grid-column: 1 / -1; }
        .pick-group { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .pick-option {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.32rem 0.6rem;
            font-size: 0.84rem;
            color: var(--text-main);
            background: var(--deep-space);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            cursor: pointer;
        }
        .pick-option:hover { border-color: var(--border-accent); }
        .pick-option input { margin: 0; accent-color: var(--accent-gold); cursor: pointer; }
        .pick-option:has(input:checked) { border-color: var(--accent-gold); background: var(--gold-glow); color: #ffffff; }
        .pick-option:has(input:disabled) { cursor: default; }
        .pick-option:has(input:focus-visible) { outline: 2px solid var(--accent-blue); outline-offset: 1px; }
        .answer.pick.right .pick-option:has(input:checked) { border-color: var(--answer-right); }
        .answer.pick.wrong .pick-option:has(input:checked) { border-color: var(--answer-wrong); }

        /* Sign grid (COE to RIC Signs): rows R, I, C under the heads rho bar and rho bar dot */
        .answers.sign-grid .answer.pick-sign { grid-column: auto; }
        .grid-head { font-size: 1.05rem; color: var(--text-muted); }

        /* Check-all lists: one column of boxes */
        .answers.check-list { grid-template-columns: minmax(0, 1fr); gap: 0.3rem; }
        .answer.check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.55rem;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            background: var(--deep-space);
            font-size: 0.88rem;
            cursor: pointer;
        }
        .answer.check input { width: 1rem; height: 1rem; margin: 0; flex: none; accent-color: var(--accent-blue); cursor: pointer; }
        .answer.check input:disabled { cursor: default; }
        .answer.check .check-name { flex: 1 1 auto; }
        .answer.check .answer-note { min-height: 0; margin: 0; white-space: nowrap; }
        .answer.check.right { border-color: var(--answer-right); }
        .answer.check.wrong { border-color: var(--answer-wrong); }

        /* The view box holds the dual stage or the flat drawing */
        .t2-host { position: absolute; inset: 0; }
        .tool-status { z-index: 3; }

        /* Sections with no view (propulsion): the answers and walkthrough in one centered column */
        body.no-view .tool-stage-col { display: none; }
        body.no-view .tool-layout { grid-template-columns: minmax(0, 42rem); justify-content: center; }

        .answer-box {
            display: flex;
            align-items: center;
            padding-right: 0.45rem;
            background: var(--deep-space);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
        }

        .answer-box:focus-within { border-color: var(--accent-blue); }
        .answer.right .answer-box { border-color: var(--answer-right); }
        .answer.wrong .answer-box { border-color: var(--answer-wrong); }

        .answer-box input {
            flex: 1 1 auto;
            min-width: 0;
            width: 100%;
            padding: 0.38rem 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.92rem;
            color: #ffffff;
            background: transparent;
            border: 0;
        }

        .answer-box input:focus { outline: none; }
        .answer-box input:read-only { color: var(--text-muted); }

        .answer-undef { display: inline-flex; align-items: center; gap: 0.25rem; margin-left: 0.5rem; font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; cursor: pointer; }
        .answer-undef input { margin: 0; accent-color: var(--accent-blue); }
        .answer-box input:disabled { color: var(--text-muted); opacity: 0.4; }
        .answer.pick-sign { grid-column: auto; }
        .pick-sign .pick-option { min-width: 2.6rem; justify-content: center; font-family: var(--font-mono); font-weight: 600; }
        .given-state { font-family: var(--font-mono); }

        .answer-unit {
            font-family: var(--font-mono);
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        .answer-note {
            min-height: 1.25em;
            margin-top: 0.1rem;
            font-size: 0.74rem;
            line-height: 1.25;
            color: var(--text-muted);
        }

        .answer.right .answer-note { color: var(--answer-right); }
        .answer.wrong .answer-note { color: var(--answer-wrong); }

        .answer-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.75rem;
            margin-top: 0.35rem;
        }

        .answer-score { font-size: 0.86rem; font-weight: 600; color: #ffffff; }
        .answer-score.warn { font-weight: 500; color: #fbbf24; }
        /* Sketch-and-check problems: the answer in words, shown in place of a score */
        .answer-score.reveal { font-weight: 400; line-height: 1.45; color: var(--text-main); }
        .answer-limits { margin-top: 0.45rem; }

        /* Walkthrough */
        .walk-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
        }

        .walk-head .panel-title { margin-bottom: 0; }
        .walk-head .btn { padding: 0.32rem 0.7rem; font-size: 0.8rem; }

        .step-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            margin-top: 0.45rem;
        }

        .step + .step { border-top: 1px solid var(--border-subtle); }

        .step-head {
            display: flex;
            align-items: baseline;
            gap: 0.55rem;
            width: 100%;
            padding: 0.42rem 0.2rem;
            font-family: inherit;
            font-size: 0.86rem;
            line-height: 1.35;
            text-align: left;
            color: var(--text-main);
            background: none;
            border: 0;
            cursor: pointer;
        }

        .step-head:hover { background: rgba(255, 255, 255, 0.03); }
        .step.active .step-head { font-weight: 600; color: #ffffff; }

        .step-num {
            flex: 0 0 1.2rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .step.active .step-num { color: var(--accent-gold); }
        .step-title { flex: 1 1 auto; min-width: 0; }

        .step-result {
            flex: 0 1 auto;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
            text-align: right;
        }

        .step-body { padding: 0.1rem 0.2rem 0.7rem 1.95rem; }

        .methods { flex-wrap: wrap; margin: 0.15rem 0 0.25rem; }
        .methods button { flex: 1 1 auto; padding: 0.3rem 0.5rem; font-size: 0.76rem; }

        .calc {
            margin-top: 0.5rem;
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .calc-sym, .calc-line { padding-block: 0.12em; overflow: auto hidden; }
        .calc-sym { color: var(--text-muted); }
        .calc-line { padding-left: 0.9rem; color: var(--text-main); }
        .calc-result { font-weight: 600; color: #ffffff; }
        .step-result .katex { font-size: 1em; }

        .step-note {
            margin-top: 0.45rem;
            font-size: 0.78rem;
            line-height: 1.4;
            color: var(--text-muted);
        }

        .step-nav {
            display: flex;
            justify-content: flex-end;
            gap: 0.4rem;
            margin-top: 0.6rem;
        }

        .step-nav .btn { padding: 0.32rem 0.8rem; font-size: 0.8rem; min-width: 4.6rem; }

        @media (min-width: 1081px) {
            .tool-layout { --aside-w: 36rem; }
        }

        @media (min-width: 1081px) and (min-height: 600px) {
            html { scroll-padding-top: calc(var(--nav-h) + 0.5rem); }
        }

        /* Tablets: the panels use the full width. */
        @media (min-width: 700px) and (max-width: 1080px) {
            .tool-side { grid-template-columns: minmax(0, 1fr); }
        }

        /* Narrow large screens: a narrower side column, so that the view keeps its size. */
        @media (min-width: 1081px) and (max-width: 1300px) {
            .tool-layout { --aside-w: 31rem; }
        }

        @media (max-width: 640px), (orientation: landscape) and (max-height: 500px) and (hover: none) and (pointer: coarse) {
            .tool-hud { font-size: 0.8rem; min-height: 0; }
            .step-body { padding-left: 0.2rem; }
        }

        @media (max-width: 640px) and (orientation: portrait) {
            :root:has(.answer input:focus) { --tool-view-h: 24svh; }
            body.answers-only .tool-main,
            body.no-view .tool-main { padding-top: calc(var(--nav-h) + 0.5rem); }
        }

        @media (orientation: landscape) and (max-height: 500px) and (hover: none) and (pointer: coarse) {
            body.answers-only .top-nav,
            body.no-view .top-nav { width: 100%; }
            body.answers-only .tool-main,
            body.no-view .tool-main { padding: calc(var(--nav-h) + 0.5rem) 1rem 1rem; }
        }
    </style>
</head>

    <main class="tool-main">
        <div class="tool-layout">
            <!-- The view of the current problem. Hidden in test mode until the answers are graded. -->
            <div class="col tool-stage-col">
                <div class="tool-view">
                    <div class="tool-canvas-box" id="view" aria-label="The problem drawn in the RIC frame.">
                        <div class="tool-status" id="status" style="display: none;"></div>
                    </div>
                    <div class="tool-hud" id="hud" aria-live="polite"></div>
                </div>
            </div>

            <aside class="tool-side">
                <div class="col">
                    <div class="panel">
                        <div class="mode-row">
                            <div class="segmented" id="mode" role="group" aria-label="Choose a mode">
                                <button type="button" data-value="practice" aria-pressed="true">Practice</button>
                                <button type="button" data-value="test" aria-pressed="false">Test</button>
                            </div>
                            <button type="button" class="btn" id="new-problem">New Problem</button>
                        </div>
                        <div class="segmented sections" id="section" role="group" aria-label="Choose a section"></div>
                        <div class="segmented topics" id="topic" role="group" aria-label="Choose a kind of problem"></div>
                    </div>

                    <div class="panel accent" id="problem-panel">
                        <div class="panel-title" id="problem-title"></div>
                        <p class="panel-text" id="problem-prompt"></p>
                        <div class="given" id="given"></div>
                        <form id="answer-form" novalidate autocomplete="off">
                            <div class="answers" id="answers"></div>
                            <div class="answer-actions">
                                <button type="submit" class="btn primary" id="check"></button>
                                <span class="answer-score" id="score" role="status"></span>
                            </div>
                        </form>
                        <p class="ctl-caption answer-limits" id="answer-limits"></p>
                    </div>

                    <div class="panel" id="walk-panel">
                        <div class="walk-head">
                            <div class="panel-title">Walkthrough</div>
                            <button type="button" class="btn" id="walk-start">Start</button>
                        </div>
                        <ol class="step-list" id="steps"></ol>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        (function () {
            const t = Date.now();
            const v = document.createElement('script');
            v.src = '../assets/vendor.js?t=' + t;
            v.onload = v.onerror = function () {
                (window.Vendor ? Vendor.script('katex') : Promise.resolve()).then(function () {
                    [
                        '../assets/tool-kit.js',
                        '../assets/earth-land.js',
                        '../assets/earth-scene.js',
                        '../math/orbit-constants.js',
                        '../math/test-review-math.js',
                        '../assets/orbit-settings-panel.js',
                        '../rpo/rpo-views.js',
                        'answer-check.js',
                        'practice-math.js',
                        'test-2-common.js',
                        'test-2-visual.js',
                        'test-2-coeric-problems.js',
                        'test-2-visual-problems.js',
                        'test-2-rmoe-problems.js',
                        'test-2-burns-problems.js',
                        'test-2-scene.js',
                        'test-2-release.js',
                        'test-2-practice.js'
                    ].forEach(function (src) {
                        const s = document.createElement('script');
                        s.src = src + '?t=' + t;
                        s.async = false;
                        document.body.appendChild(s);
                    });
                });
            };
            document.body.appendChild(v);
        })();
    </script>
</body>
</html>
