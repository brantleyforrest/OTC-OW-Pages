<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study | OTC OW</title>
    <meta http-equiv="refresh" content="0; url=index.html#study">
    <link rel="canonical" href="index.html#study">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        window.location.replace("index.html#study");
    </script>
    <style>
        :root {
            --deep-space: #060b14;
            --surface-card: #0d1726;
            --border-subtle: #1c2e4a;
            --accent-gold: #c59b3c;
            --gold-glow: rgba(197, 155, 60, 0.25);
            --text-main: #f0f4fa;
            --text-muted: #94a3b8;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--deep-space);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(24, 76, 140, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(197, 155, 60, 0.08) 0%, transparent 35%);
        }

        .redirect-card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        }

        .icon-circle {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            background: rgba(197, 155, 60, 0.12);
            color: var(--accent-gold);
            border: 1px solid var(--gold-glow);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }

        .btn-launch {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #184c8c 0%, #2563eb 100%);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-launch:hover {
            background: linear-gradient(135deg, #1d58a3 0%, #3b82f6 100%);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <div class="icon-circle">
            <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
        </div>
        <h1>Study &amp; Guides</h1>
        <p>The Study portal has moved. If you are not redirected automatically, please click below to view the study materials.</p>
        <a href="index.html#study" class="btn-launch">
            Continue to Study Portal
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
        </a>
    </div>
</body>
</html>
