<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Inertial Rendezvous | OTC OW</title>
    <meta name="description" content="Move sliders to set up a coplanar or co-orbital rendezvous, and watch the wait time, phasing orbit, burns, and equations update.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/tool-theme.css">
    <style>
        :root {
            --orbit1: #e0b64f;
            --orbit2: #34d399;
            --transfer: #ff8a3d;
            --phase: #a3e635;
            --param-dv: #f87171;
            --param-theta: #38bdf8;
            --param-tof: #c4a1ff;
            --node: #fbbf24;
            --radius: #f0f4fa;
        }

        /* Two side columns on wide screens */
        @media (min-width: 1300px) and (min-height: 600px) {
            .tool-layout { --aside-w: 40rem; }
            .tool-side { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        /* Math */
        .katex { font-size: 1.05em; }
        .tex-source { font-family: var(--font-mono); font-size: 0.85em; overflow-wrap: anywhere; }

        /* Caption below view */
        .tool-hud {
            position: static;
            max-width: none;
            margin-top: 0.45rem;
            padding: 0;
            min-height: 2.7em;
            background: none;
            border: 0;
            border-radius: 0;
            font-size: 0.84rem;
            line-height: 1.35;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .tool-hud b { font-weight: 600; color: #ffffff; }
        .tool-hud .katex { color: #ffffff; }

        .mission-clock {
            position: absolute;
            top: 0.6rem;
            left: 0.6rem;
            z-index: 2;
            padding: 0.28rem 0.6rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffffff;
            background: rgba(6, 11, 20, 0.78);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            pointer-events: none;
            user-select: none;
        }

        .view-reset {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            z-index: 2;
            padding: 0.28rem 0.6rem;
            font-size: 0.74rem;
        }

        /* Labels in the view */
        .tool-label { z-index: 1; }
        .tool-label.word { color: var(--text-muted); font-size: 0.72rem; }

        .tool-label.measure {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0 0.25rem;
            border-radius: 3px;
            background: rgba(6, 11, 20, 0.78);
        }

        .tool-label.measure .val { margin-left: 0.35rem; color: #ffffff; }
        .tool-label.measure .val:empty { display: none; }

        .tool-label.axis {
            z-index: 0;
            font-size: 1.05rem;
            padding: 0 0.3rem;
            border-radius: 3px;
            color: #ffffff;
            background: rgba(6, 11, 20, 0.78);
        }

        .tool-label.axis .katex { color: #93c5fd; }
        .tool-label .katex { font-size: 1.12em; }

        /* Controls Panel */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #rendezvous-mode { flex: 1 1 24rem; }
        .timeline-grow { flex: 3 1 14rem; }
        .speed-grow { flex: 1 1 7rem; min-width: 7rem; }
        #btn-back, #btn-next { min-width: 4.6rem; }

        .tag-info {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: rgba(255, 255, 255, 0.12);
            color: #93c5fd;
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            margin-left: 0.35rem;
            font-weight: 600;
            vertical-align: middle;
        }

        .ctl-checks-row {
            padding-top: 0.35rem;
            border-top: 1px solid var(--border-subtle);
            margin-top: 0.2rem;
        }

        .ctl-checks {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .ctl-checks .check {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.35rem;
            cursor: pointer;
            user-select: none;
        }

        .ctl-checks .check input {
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        /* Sliders Grid */
        .sliders-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.4rem 0.85rem;
        }

        @media (max-width: 680px) {
            .sliders-grid {
                grid-template-columns: 1fr;
            }
        }

        .slider-field {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .slider-field .control-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .slider-field .control-value {
            font-family: var(--font-mono);
            font-weight: 600;
            color: #ffffff;
            font-size: 0.82rem;
        }

        .slider-field .control-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-left: 0.35rem;
            font-weight: normal;
        }

        .slider-field .control-value.fixed-badge {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-size: 0.74rem;
        }

        .earth-radius-hint {
            font-size: 0.7rem;
            color: var(--text-dim, #64748b);
        }

        .slider-presets {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.15rem;
        }

        .btn-preset-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 4px;
            font-size: 0.72rem;
            padding: 0.12rem 0.45rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-preset-pill:hover {
            color: #ffffff;
            border-color: var(--border-accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-sm {
            padding: 0.28rem 0.6rem;
            font-size: 0.76rem;
        }

        /* Equations Panel */
        .equations-panel {
            padding: 0.75rem 0.9rem;
        }

        .equation-cards {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            margin-top: 0.35rem;
        }

        .equation-card {
            border-left: 3px solid transparent;
            background: var(--surface-card);
            border-radius: 6px;
            padding: 0.5rem 0.65rem;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
            border: 1px solid var(--border-subtle);
            border-left-width: 3px;
        }

        .equation-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-accent);
        }

        .equation-card.active {
            border-left-color: var(--accent-gold);
            background: var(--gold-glow);
        }

        .eq-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .equation-card.active .eq-title {
            color: var(--accent-gold);
        }

        .eq-sym {
            color: #ffffff;
            font-size: 0.92rem;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 0.1rem 0;
        }

        .eq-num {
            color: var(--text-muted);
            font-size: 0.84rem;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 0.1rem 0;
        }

        .eq-res {
            color: #ffffff;
            font-weight: 600;
            font-size: 0.88rem;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 0.1rem 0;
        }

        .eq-note {
            font-size: 0.73rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
            font-style: italic;
        }

        /* Live Values */
        .stat-grid {
            margin-top: 0.35rem;
            gap: 0.45rem 0.6rem;
        }

        .stat-item {
            padding: 0.35rem 0.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-item .stat-label {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .stat-item .stat-val {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.82rem;
            color: #ffffff;
            margin-top: 0.15rem;
        }

        .unit-sub {
            font-size: 0.74rem;
            font-weight: normal;
            color: var(--text-muted);
        }

        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 0.45rem;
        }

        .constraint-chip {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .constraint-chip.ok {
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .constraint-chip.warn {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .constraint-chip.info {
            background: rgba(224, 182, 79, 0.1);
            color: var(--accent-gold);
            border: 1px solid rgba(224, 182, 79, 0.3);
            font-weight: 500;
        }

        .chip-container[hidden] { display: none; }

        .eq-note .note-warn { color: #f87171; font-style: normal; font-weight: 600; }
        .eq-note .note-ok { color: #34d399; font-style: normal; font-weight: 600; }
        .eq-sym + .eq-sym, .eq-res + .eq-sym { margin-top: 0.3rem; }

        /* Trade Panel */
        .trade-content {
            margin-top: 0.35rem;
            font-size: 0.8rem;
        }

        .trade-caption,
        .trade-head {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .trade-head {
            display: grid;
            grid-template-columns: 3.4rem minmax(0, 1fr) auto;
            gap: 0.6rem;
            padding: 0 0.55rem 0.25rem;
        }

        .trade-row-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .trade-row {
            width: 100%;
            padding: 0.35rem 0.55rem;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            font: inherit;
            font-size: 0.8rem;
            color: var(--text-main);
            text-align: left;
            transition: border-color 0.15s, background-color 0.15s;
        }

        button.trade-row {
            display: grid;
            grid-template-columns: 3.4rem minmax(0, 1fr) auto;
            cursor: pointer;
        }

        button.trade-row:hover {
            border-color: var(--border-accent);
            background: var(--surface-hover);
        }

        .trade-row.active {
            border-color: var(--accent-gold);
            background: var(--gold-glow);
        }

        .trade-row.warn {
            border-color: rgba(248, 113, 113, 0.4);
            background: rgba(248, 113, 113, 0.08);
        }

        .trade-row.active.warn { border-color: #f87171; }

        .trade-k { font-weight: 600; white-space: nowrap; }

        .trade-time {
            font-family: var(--font-mono);
            font-weight: 600;
            white-space: nowrap;
            color: #ffffff;
        }

        .trade-dv {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .trade-mini-track {
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.07);
            overflow: hidden;
        }

        .trade-mini-fill {
            display: block;
            height: 100%;
            background: var(--param-dv);
        }

        .trade-dv-val { font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-muted); }
        .trade-flag { color: #f87171; font-family: var(--font-sans, inherit); font-size: 0.68rem; margin-left: 0.25rem; }

        .trade-bar-track {
            height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 0.35rem 0 0.2rem;
            position: relative;
        }

        .trade-bar-fill {
            height: 100%;
            background: var(--param-dv);
            transition: width 0.15s ease-out;
        }

        .trade-bar-fill.wait { background: var(--param-theta); opacity: 0.75; }

        .trade-bar-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ffffff;
        }

        .trade-bar-scale {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .trade-note {
            font-size: 0.74rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            line-height: 1.35;
        }

        /* HUD extras */
        .hud-tag {
            display: inline-block;
            margin-left: 0.35rem;
            padding: 0 0.4rem;
            border-radius: 3px;
            font-size: 0.74rem;
            color: var(--accent-gold);
            border: 1px solid rgba(224, 182, 79, 0.35);
        }

        .hud-btn { margin-left: 0.4rem; }

        #btn-lesson-example[aria-pressed="true"] {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            background: var(--gold-glow);
        }

        .slider-wide { grid-column: 1 / -1; }
        .control-label sub { font-size: 0.72em; }

        /* Phone layout */
        @media (max-width: 640px) and (orientation: portrait) {
            #rendezvous-mode { flex-basis: 100%; }
            .tool-hud { font-size: 0.8rem; min-height: 0; }
            input[type="range"] { min-height: 28px; }
        }

        @media (orientation: landscape) and (max-height: 500px) and (hover: none) and (pointer: coarse) {
            input[type="range"] { min-height: 28px; }
        }
    </style>
</head>

    <main class="tool-main">
        <div class="tool-layout">
            <!-- Stage column: 3D View and Controls -->
            <div class="col tool-stage-col">
                <p class="tool-intro">Move the sliders and watch when, and where, the chase must burn to meet the target.</p>

                <div class="tool-view">
                    <div class="tool-canvas-box" id="view">
                        <canvas id="scene" aria-label="3D Inertial Rendezvous Visualization" style="touch-action: none;"></canvas>
                        <div class="tool-labels" id="labels" aria-hidden="true"></div>
                        <div class="mission-clock" id="mission-clock">t = 0:00:00</div>
                        <button type="button" class="btn view-reset" id="reset-view">Reset View</button>
                        <div class="tool-hint" id="view-hint">Drag to rotate. Scroll or pinch to zoom.</div>
                        <div class="tool-status" id="status" style="display: none;"></div>
                    </div>
                    <div class="tool-hud" id="hud" aria-live="polite"></div>
                </div>

                <div class="panel controls">
                    <!-- Row 1: Rendezvous Mode Selector -->
                    <!-- Note: Noncoplanar and Gauss modes were removed per user instruction as they are not useful for this project. -->
                    <div class="ctl-row">
                        <div class="segmented" id="rendezvous-mode" role="group" aria-label="Select rendezvous mode">
                            <button type="button" data-mode="coplanar" aria-pressed="true">Coplanar</button>
                            <button type="button" data-mode="coorbital" aria-pressed="false">Co-orbital</button>
                        </div>
                        <button type="button" class="btn btn-sm" id="btn-lesson-example" aria-pressed="false" title="Load the lesson's worked example">Lesson Example</button>
                        <button type="button" class="btn btn-sm" id="btn-reset-values" title="Restore default slider values for current mode">Reset Values</button>
                    </div>

                    <!-- Row 2: Playback -->
                    <div class="ctl-row">
                        <div class="buttons">
                            <button type="button" class="btn" id="btn-back">Back</button>
                            <button type="button" class="btn primary" id="btn-next">Next</button>
                            <button type="button" class="btn" id="btn-rewind">Restart</button>
                        </div>
                        <div class="ctl-grow timeline-grow">
                            <div class="control-label">
                                <label for="timeline-slider">Timeline</label>
                                <span class="control-value" id="timeline-value">Overview</span>
                            </div>
                            <input type="range" id="timeline-slider" min="0" max="1000" value="0">
                        </div>
                        <div class="ctl-grow speed-grow">
                            <div class="control-label">
                                <label for="speed">Speed</label>
                                <span class="control-value" id="speed-value">Normal</span>
                            </div>
                            <input type="range" id="speed" min="0" max="2" step="1" value="1">
                        </div>
                    </div>

                    <!-- Row 3: Sliders per Mode -->
                    <div id="sliders-container"></div>

                    <!-- Row 4: View Checkboxes -->
                    <div class="ctl-row ctl-checks-row">
                        <div class="ctl-checks">
                            <label class="check"><input type="checkbox" id="check-vectors" checked>Velocity vectors</label>
                            <label class="check"><input type="checkbox" id="check-angles" checked>Angles</label>
                            <label class="check"><input type="checkbox" id="check-labels" checked>Labels</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Two Side Columns on Desktop -->
            <aside class="tool-side">
                <!-- Column 1: Equations Panel -->
                <div class="col">
                    <div class="panel equations-panel">
                        <div class="panel-title">Equations</div>
                        <div class="equation-cards" id="equation-cards"></div>
                    </div>
                </div>
