--------------------------------------------------------------------------------
0. GOAL
--------------------------------------------------------------------------------
An interactive 3D tool covering the four maneuver types from Test 1 Practice
(practice/test-1-practice.html, "Orbital Maneuvers" section):
    - Hohmann transfer
    - Simple plane change: inclination (RAAN stays the same)
    - Simple plane change: RAAN of a polar orbit
    - Combined plane change (a Hohmann transfer that also changes inclination)

Test 1 Practice gives the student numbers and has them do the math. This page
does the opposite. The reader moves sliders, the 3D view updates live, and the
equations at the side update with the current numbers substituted in. Nothing
is graded or hidden. The point is to see how each input changes the orbits, the
burns, and the cost in delta-V.

Not in scope: generated problems, answer boxes, grading, test mode, step-by-step
walkthroughs, the 5-column table, and the R-V to COE section.

4. MANEUVER TYPES AND SLIDERS
--------------------------------------------------------------------------------
All radii are from Earth's center, in km, never altitudes. Show values with a
thousands comma ("24,000 km") and angles with a degree sign. Show Earth's
radius (6,378 km) as a faint mark or note near the radius sliders, so it is
clear that the minimum is just above the surface.

Hohmann
    R1   initial orbit radius    6,700 to 45,000 km, step 100, default 9,600
    R2   target orbit radius     6,700 to 45,000 km, step 100, default 24,000
    R2 < R1 is allowed: the maneuver lowers the orbit and both burns are
    retrograde. If R1 = R2, show "No transfer needed" in the HUD and draw only
    the one orbit. Optional: a small "LEO to GEO" preset button
    (6,678 km to 42,164 km).

Inclination
    r    orbit radius            6,700 to 45,000 km, step 100, default 12,000
    i1   initial inclination     0 to 90°, step 0.5, default 28.5
    i2   target inclination      0 to 90°, step 0.5, default 55.0
    Ω    RAAN, for both orbits   0 to 355°, step 5, default 45
    u    spacecraft position     0 to 355°, step 5, default 270
         (argument of latitude, from the ascending node)

Polar RAAN (i = 90° for both orbits, shown as a fixed value, not a slider)
    r    orbit radius            6,700 to 45,000 km, step 100, default 12,000
    Ω1   initial RAAN            0 to 180°, step 5, default 30
    Ω2   target RAAN             0 to 180°, step 5, default 60
    u    spacecraft position     0 to 355°, step 5, default 30

Combined
    R1, R2 as in Hohmann, defaults 9,600 and 24,000
    i1, i2 as in Inclination, defaults 28.5 and 0.0
    "Plane change at", segmented: Higher orbit | Lower orbit | Separate burn
        Higher orbit (default) is the method taught in Test 1.
        Lower orbit puts the whole plane change in the burn at the lower orbit.
        Separate burn does a Hohmann transfer and then a simple plane change
        at the higher orbit as a third burn.
    The point is to compare costs: the Delta-V Budget panel (section 8) shows
    the total for all three choices, with the chosen one highlighted, so the
    reader sees that the plane change is cheapest where the spacecraft is
    slowest.

When the type changes, keep each type's last slider values, so that switching

--------------------------------------------------------------------------------
5. PHYSICS
--------------------------------------------------------------------------------
Use the solvers in practice/maneuvers-problems.js through window.ManeuversProblems.
They are pure functions and match the class formulas:
    solveHohmann(R1, R2)
        returns a_tx, v1, v_tx1, v_tx2, v2, dv1, dv2, dv_total, tof_s, tof_min, isRaise
    solveInclinationChange(alt, i1, i2, raan, u_sc)
        returns v, delta_theta, dv, period_s, next_node, delta_u_to_node,
        u_burn, time_to_burn_s
    solvePolarRaanChange(alt, raan1, raan2, u_sc)
        returns v, delta_theta, dv, period_s, next_pole, delta_u_to_pole, u_burn,
        time_to_burn_min
    solveCombined(R1, R2, i1, i2)
        returns the Hohmann values plus v_initial, v_final, dv_combined,
        dv_separate, and dv1, dv2, dv_total with the plane change at the
        higher orbit
    constants: { MU: 398600.4418, R_EARTH: 6378.137 }

The plane change solvers take an ALTITUDE. Pass r - constants.R_EARTH, the same
as test-1-maneuver-problems.js does (altitudeFor).

Add one small function in orbital-maneuvers.js for the "Lower orbit" choice of
the combined maneuver, which the solvers do not cover. At the lower orbit, with
V_a the speed before the burn and V_b the speed after it:
    Delta V = sqrt(V_a^2 + V_b^2 - 2 V_a V_b cos(Delta theta))
For a raise, the lower-orbit burn is burn 1 (V_a = v1, V_b = v_tx1) and burn 2 is
the plain Hohmann dv2. For a lowering, the lower-orbit burn is burn 2
(V_a = v_tx2, V_b = v2) and burn 1 is the plain Hohmann dv1. The "Separate burn"
total is solveCombined(...).dv_separate plus the other Hohmann burn; check that
total against a hand calculation before using it, and write the check in the
final report.

Position along the transfer: the timeline (section 6.4) needs the spacecraft's
place on the half ellipse at a given time, so that it moves faster near perigee
and slower near apogee. Write a small Kepler solver: mean anomaly M = π t / TOF,
solve M = E - e sin E by Newton's method (about 6 iterations, start at E = M),
then true anomaly from E. The transfer's e = |R2 - R1| / (R1 + R2).

Check displayed numbers against the solvers, and the solvers against one worked
example from the lesson (maneuvers-problems.js has PRESETS for lecture examples).

6.1 Approach
practice/test-1-maneuver-scene.js draws exactly these maneuvers, but it is
built around walkthrough stages (parts appear, focus, and dim step by step).
This page needs the opposite: every part visible at once, rebuilt whenever a
slider moves. Write a new, simpler scene with no stage machine. Use the old
maneuvers-scene.js (section 1.1) for the overall structure: one builder per
type, a trajectory(prog) function, and a playback state. Then copy these
pieces from test-1-maneuver-scene.js for the drawing style, since it is newer
and matches the rest of the site:
    - the "ghosted" draw method (solid object plus a dim copy drawn without
      depth testing, so orbits behind Earth stay faintly visible)
    - createArrow / placeArrow, createTube / drawTube, createMarker, turnArc
    - orbitPoint(r, inc, raan, u) and orbitTangent(inc, raan, u)
    - frame(reach): sizing the view and axes from the largest orbit
    - burnAt(): where to draw the velocity before and after a burn, and delta-V
      from the tip of the old velocity to the tip of the new one
    - the COLORS table, so this page matches Test 1 Practice:
        eci axes #60a5fa, orbit1 #e0b64f, orbit2 #34d399, transfer #ff8a3d,
        dv #f87171, node #fbbf24, theta #38bdf8, tof #c4a1ff

Units: Earth's radius = 1 scene unit (assets/earth-scene.js uses radius 1, Z
north). Divide km by constants.R_EARTH. The largest orbit (45,000 km) is about
7 Earth radii.

Public interface:
    ManeuverScene.create(THREE, dom, constants) returns
        setModel(model)     Rebuild geometry for new slider values (section 6.3)
        setTime(t)          Place the spacecraft and burns at timeline t (0 to 1)
        setShown({ vectors, angles, labels })
        resetView()
        resize()

6.2 What is drawn, by type
Hohmann
    - orbit 1 and orbit 2 as circles in the equatorial plane
    - the transfer half ellipse, with the unused half dashed and faint
    - burn markers at perigee and apogee of the transfer
    - at each burn, velocity arrows before (old orbit color) and after (new orbit
      color), and the delta-V arrow (dv color) between their tips
    - a faint line through both burns (the line of apsides)
    - labels: R1, R2, a_tx (half of the long axis), ΔV1, ΔV2
Inclination
    - the initial and target orbits, same radius, same Ω, different tilt
    - the line of nodes, with both nodes marked; the burn node is highlighted
    - an arc for Δθ at the burn node, between the two orbit planes
    - at the node: the velocity before and after (same length), and ΔV
    - an arc along the initial orbit from the spacecraft (at u) to the burn
      node, labeled Δu
    - the equatorial plane as a faint disc, and Ω as an arc from the I axis
Polar RAAN
    - same as Inclination, but the orbits cross over the poles, so the burn
      point is a pole and the crossing line is Earth's spin axis
    - Ω1 and Ω2 arcs in the equatorial plane, with the ΔΩ between them
Combined
    - everything from Hohmann, but orbit 2 (and the transfer after the plane
      change) is tilted by Δθ about the line of apsides
    - at the burn that carries the plane change, the velocity triangle: old
      velocity, new velocity in the new plane, ΔV across the tips, and the Δθ arc
      between the old and new velocities. Draw it larger than the other burn
      so the triangle is readable.
    - "Separate burn" shows a third burn marker at the higher orbit

Arrow lengths: scale velocities so the fastest velocity at a burn is drawn half
as long as the radius there (the rule in test-1-maneuver-scene.js transferData),
and use the same scale for every arrow of that maneuver, so lengths compare
honestly. ΔV arrows use the same scale. If a ΔV arrow would be shorter than about
0.08 scene units, draw it at that minimum length and say so in its label
("ΔV (enlarged)"), so it stays visible.

6.3 Rebuilding on slider input
Sliders fire "input" many times a second. Mark the model dirty and rebuild at
most once per animation frame (Kit.startLoop already gives one callback per
frame). Reuse geometries and update their position buffers rather than creating
new meshes; dispose any geometry that is replaced. Keep the camera where the
reader left it when sliders move, but ease its distance when the largest orbit
grows or shrinks by more than about 15%, so the orbits stay in view. Switching
maneuver type moves the camera to that type's home view (Hohmann and Combined:
mostly from above the plane; plane changes: looking along the crossing line,
like aboveView/homeView in test-1-maneuver-scene.js, so the angle between the
planes is visible and not edge-on).

Interaction: drag to rotate, scroll or pinch to zoom, a Reset View button, and
touch-action: none on the canvas, as in the other 3D tools.

6.4 Timeline
One timeline slider, 0 to 1, with Play/Pause. Playing moves it at the chosen
speed and loops after a short pause at the end. Dragging the slider holds the
animation still; base the controls on the old page's playback bar
(section 1.1).

Phases for Hohmann and Combined:
    0.00 to 0.20   coast on orbit 1 to burn 1
    0.20 to 0.25   burn 1 (arrows and ΔV1 brighten, spacecraft flashes)
    0.25 to 0.75   fly the transfer half ellipse (Kepler timing, section 5)
    0.75 to 0.80   burn 2
    0.80 to 1.00   coast on orbit 2
    (Separate burn adds a short third burn phase after burn 2.)
Phases for the plane changes:
    0.00 to 0.45   coast from u to the burn point, covering Δu
    0.45 to 0.55   burn: the velocity swings from the old plane into the new
                   one, sweeping the Δθ arc as it goes
    0.55 to 1.00   coast on the new orbit

Before a burn, the arrows for it are dim; during the burn they brighten; after
it, they stay at normal brightness. The current phase is sent to the equations
panel (section 7) so the matching equation is highlighted, and to the HUD.

Respect prefers-reduced-motion: start paused (Kit.prefersReducedMotion()).

6.5 Labels
Use ToolKit.LabelLayer, as in the template. Labels are KaTeX symbols through
PracticeMath.math() with the value beside them, for example "ΔV1  1.234 km/s".
Mark minor labels (Ω, Δu, axis names) as optional so they drop first when
crowded. Hide a label when Earth blocks the view of its point (isBlocked() in
the template).

7. EQUATIONS PANEL
--------------------------------------------------------------------------------
Off to the side of the view, one card per equation for the current type. Each
card has three lines:
    1. the formula in symbols
    2. the formula with the current numbers in it
    3. the result with units
Render with PracticeMath.math(). Use the same TeX style as
maneuvers-problems.js (398{,}600.44 for μ, \sqrt{\frac{...}{...}}).
Color each symbol to match its object in the 3D view (orbit 1 gold, orbit 2
green, transfer orange, ΔV red, angles blue, time violet), using \textcolor in
the TeX, or CSS tokens on :root like --param-* in test-1-practice.html.

Cards by type:
Hohmann
    a_tx = (R1 + R2) / 2
    V1 = sqrt(μ / R1),  V2 = sqrt(μ / R2)
    V_tx1 = sqrt(μ (2 / R1 - 1 / a_tx)),  V_tx2 = sqrt(μ (2 / R2 - 1 / a_tx))
    ΔV1 = |V_tx1 - V1|,  ΔV2 = |V2 - V_tx2|
    ΔV_total = ΔV1 + ΔV2
    TOF = π sqrt(a_tx^3 / μ)   (show minutes and h:mm:ss; formatHms exists in
                                 maneuvers-problems.js but is not exported, so
                                 copy it)
Inclination and Polar RAAN
    V = sqrt(μ / r)
    Δθ = |i2 - i1|   or   Δθ = |Ω2 - Ω1|
    ΔV = 2 V sin(Δθ / 2)
    Where to burn: the next node (or pole), Δu, and the time to get there,
        Δu / 360° times the period
Combined
    The Hohmann cards, with the plane change burn replaced by
    ΔV = sqrt(V_a^2 + V_b^2 - 2 V_a V_b cos(Δθ))
    using the speeds of whichever burn carries the plane change

Highlight the card that matches the current timeline phase (left border in the
accent color, brighter text). Clicking a card jumps the timeline to that phase.

Re-render only the cards whose numbers changed, once per frame at most, because
KaTeX rendering on every slider event is slow on phones.

Writing rules for this panel and the whole page:
    - Division is written with a slash or as a \frac. Never ÷ or \div,
      anywhere on the page.
    - Explain angles by inspection, not with vector formulas. For example: the
      two inclination orbits cross at the nodes, so the angle between them there
      is Δi; polar orbits all pass over both poles, so the angle between them
      there is ΔΩ. Do not introduce angular momentum vectors or dot products.
      If a direction needs explaining, use the right-hand rule.
    - Keep text short. One sentence per card note at most.

8. LIVE VALUES, DELTA-V BUDGET, WHAT TO NOTICE
--------------------------------------------------------------------------------
Live Values (stat-grid from the template): the key results for the type, such as
a_tx, ΔV1, ΔV2, ΔV_total, TOF for Hohmann; V, Δθ, ΔV, Δu, time to burn for the
plane changes. Speeds to 3 decimals in km/s with m/s in small text after.

Delta-V Budget: a horizontal bar per burn, stacked into the total, drawn with
plain HTML/CSS (no chart library), in the dv color. For Combined, show three
total bars (Higher orbit, Lower orbit, Separate burn) on one shared scale, with
the chosen one highlighted, so the comparison is visible at a glance. For the
plane changes, show ΔV as a share of the orbital speed V (ΔV / V), to show how
quickly plane changes get expensive.

Optional, only if it fits at 1366x650 without shrinking the view: a small
ΔV-versus-Δθ curve (0 to 90°) for the plane changes, with a dot at the current
value, drawn on a 2D canvas sized with ToolKit.observeSize.

What to Notice, one or two sentences per type, for example:
    Hohmann: "The two burns are on opposite sides of Earth. The transfer takes
              half a lap of the transfer orbit."
    Plane changes: "The burn turns the velocity without changing its speed.
              The faster the orbit, the more that turn costs."
    Combined: "Turning the plane where the spacecraft is slowest costs least."
